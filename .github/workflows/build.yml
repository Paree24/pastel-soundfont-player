name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash # Git Bash on all runners (PowerShell string handling differs)

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ''
            artifact: linux
            cmake_extra: ''
          - os: windows-latest
            exe: '.exe'
            artifact: windows
            cmake_extra: ''
          - os: macos-latest
            exe: ''
            artifact: macos
            cmake_extra: '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxdamage-dev \
            libxext-dev libxfixes-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: build/PastelHarness_artefacts/Release/PastelHarness${{ matrix.exe }}
        # Real-bank checks skip automatically when the commercial bank is
        # absent; all synthetic-fixture checks must pass.

      - name: Package
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          cd "${{ github.workspace }}/build/PastelPlayer_artefacts/Release"
          ls
          cmake -E tar czf "${{ github.workspace }}/dist/Pastel-Soundfont-Player-${{ matrix.artifact }}-VST3.tar.gz" "Pastel Soundfont Player.vst3"
          cmake -E tar czf "${{ github.workspace }}/dist/Pastel-Soundfont-Player-${{ matrix.artifact }}-Standalone.tar.gz" "Standalone"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ github.workspace }}/dist/
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
